plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ryuseongcheol.matjip'
version = '1.0.0'

android {
  namespace "expo.modules.paymentnotifications"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles("proguard-rules.pro")
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
