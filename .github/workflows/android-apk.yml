name: Android APK (테스트용)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "앱이 호출할 추천 API 서버 주소"
        required: true
        default: "https://place.spikeryu.workers.dev"
  push:
    branches: [main]
    paths: ["mobile/**", "lib/classify.ts", "lib/themes.ts", "lib/detailFromRaw.ts", "lib/kakaoDetail.ts", "lib/util.ts", "lib/types.ts", ".github/workflows/android-apk.yml"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 테스트용 Release에 APK를 올리기 위해

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://place.spikeryu.workers.dev' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        # 테스트 배포용: 생성된 프로젝트의 기본 debug 키로 서명된 release APK
        # arm64: 실제 폰, x86_64: 실행 점검용 에뮬레이터
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/matjip-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/matjip-latest.apk
          ls -lh ../dist

      - name: Check API URL is bundled
        run: |
          unzip -p ../dist/matjip-latest.apk assets/index.android.bundle | grep -a -q "$EXPO_PUBLIC_API_URL" \
            && echo "API URL OK: $EXPO_PUBLIC_API_URL" \
            || (echo "::error::번들에 API 주소가 없습니다"; exit 1)

      - name: Publish to test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-test
          NOTES="테스트용 APK (커밋 ${GITHUB_SHA::7}, 서버 $EXPO_PUBLIC_API_URL). 폰에서 matjip-latest.apk를 받아 설치하세요."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "Android 테스트 빌드" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" ../dist/matjip-latest.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: matjip-android-apk
          path: dist/*.apk
          retention-days: 14

  # 설치 후 실제로 켜지는지 에뮬레이터에서 점검하고 오류 로그를 남긴다
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matjip-android-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 실행 점검
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r "$(ls apk/*.apk | head -1)"
            adb logcat -c
            adb shell pm grant com.ryuseongcheol.matjip android.permission.ACCESS_FINE_LOCATION || true
            adb shell monkey -p com.ryuseongcheol.matjip -c android.intent.category.LAUNCHER 1
            sleep 40
            echo "===== crash 버퍼 =====" ; adb logcat -d -b crash -v brief | head -120 || true
            adb logcat -d -v brief > logcat.txt || true
            echo "===== JS 로그 =====" ; grep -E "ReactNativeJS|E/ReactNative" logcat.txt | head -80 || true
            adb exec-out screencap -p > screen.png || true
            adb shell pidof com.ryuseongcheol.matjip && echo "SMOKE: APP_RUNNING" || (echo "SMOKE: APP_NOT_RUNNING"; exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs
          path: |
            logcat.txt
            screen.png
          retention-days: 7
