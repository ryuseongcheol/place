name: Android APK

# 빌드 → 에뮬레이터 실행 점검 → 통과하면 버전 Release 게시
# - 버전(1.1.0)은 mobile/app.config.ts 의 APP_VERSION, 빌드 번호는 이 워크플로의 실행 번호
# - Release: android-v<버전>-<빌드> (변경 내역 자동), 고정 링크 android-test/matjip-latest.apk 도 갱신

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "앱이 호출할 추천 API 서버 주소"
        required: true
        default: "https://place.spikeryu.workers.dev"
  push:
    branches: [main]
    paths: ["mobile/**", "lib/classify.ts", "lib/themes.ts", "lib/detailFromRaw.ts", "lib/kakaoDetail.ts", "lib/util.ts", "lib/types.ts", ".github/workflows/android-apk.yml"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Release에 APK를 올리기 위해

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://place.spikeryu.workers.dev' }}
      NODE_OPTIONS: --max-old-space-size=4096
      APP_BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 버전 정하기
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('fs').readFileSync('app.config.ts','utf8').match(/APP_VERSION = \"([^\"]+)\"/)[1])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "APP_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APK_NAME=matjip-$VERSION-$APP_BUILD_NUMBER.apk" >> "$GITHUB_ENV"
          echo "버전 $VERSION (빌드 $APP_BUILD_NUMBER, 커밋 ${GITHUB_SHA::7})"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        # 테스트 배포용: 생성된 프로젝트의 기본 debug 키로 서명된 release APK
        # arm64: 실제 폰, x86_64: 실행 점검용 에뮬레이터
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/$APK_NAME"
          ls -lh ../dist

      - name: Check API URL is bundled
        run: |
          unzip -p "../dist/$APK_NAME" assets/index.android.bundle | grep -a -q "$EXPO_PUBLIC_API_URL" \
            && echo "API URL OK: $EXPO_PUBLIC_API_URL" \
            || (echo "::error::번들에 API 주소가 없습니다"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: matjip-android-apk
          path: dist/*.apk
          retention-days: 14

  # 설치 후 실제로 켜지는지 에뮬레이터에서 점검하고 오류 로그를 남긴다
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matjip-android-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 실행 점검
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r "$(ls apk/*.apk | head -1)"
            adb shell dumpsys package com.ryuseongcheol.matjip | grep -E "versionCode|versionName" | head -2
            adb shell dumpsys package com.ryuseongcheol.matjip | sed -n '/requested permissions:/,/install permissions:/p' | head -30
            adb shell dumpsys package com.ryuseongcheol.matjip | sed -n '/requested permissions:/,/install permissions:/p' | grep -qE "SYSTEM_ALERT_WINDOW|READ_SMS|RECEIVE_SMS|EXTERNAL_STORAGE" && (echo "SMOKE: RISKY_PERMISSION"; exit 1) || echo "SMOKE: PERMISSIONS_OK"
            adb logcat -c
            adb shell pm grant com.ryuseongcheol.matjip android.permission.ACCESS_FINE_LOCATION || true
            adb shell monkey -p com.ryuseongcheol.matjip -c android.intent.category.LAUNCHER 1
            sleep 40
            echo "===== crash 버퍼 =====" ; adb logcat -d -b crash -v brief | head -120 || true
            adb logcat -d -v brief > logcat.txt || true
            echo "===== JS 로그 =====" ; grep -E "ReactNativeJS|E/ReactNative" logcat.txt | head -80 || true
            adb exec-out screencap -p > screen.png || true
            adb shell pidof com.ryuseongcheol.matjip && echo "SMOKE: APP_RUNNING" || (echo "SMOKE: APP_NOT_RUNNING"; exit 1)
            echo "===== 결제 알림 읽기 점검 ====="
            adb shell "cmd notification post -S bigtext -t '삼성카드 승인' paytest1 '삼성1234승인 홍*동 9,500원 일시불 11/13 08:10 멘야하나 누적 98,000원'" || true
            sleep 2
            adb shell cmd notification allow_listener com.ryuseongcheol.matjip/expo.modules.paymentnotifications.PaymentNotificationListener || true
            sleep 6
            adb shell "cmd notification post -S bigtext -t '신한카드' paytest2 '신한카드(1234)승인 홍*동 12,000원(일시불)11/13 12:30 진국집 누적1,234,000원'" || true
            sleep 5
            adb logcat -d -v brief | grep "PayNoti" | tail -20 || true
            adb logcat -d -v brief | grep -q "PayNoti.*scanned.*captured [1-9]" && echo "SMOKE: PAYNOTI_SCAN_OK" || (echo "SMOKE: PAYNOTI_SCAN_MISSING"; exit 1)
            adb logcat -d -v brief | grep -q "PayNoti.*captured com.android.shell" && echo "SMOKE: PAYNOTI_OK" || (echo "SMOKE: PAYNOTI_MISSING"; exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs
          path: |
            logcat.txt
            screen.png
          retention-days: 7

  # 점검을 통과한 빌드만 버전 Release로 게시
  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: matjip-android-apk
          path: apk

      - name: 버전 Release 게시
        run: |
          TAG="android-v$VERSION-$BUILD"
          APK="apk/matjip-$VERSION-$BUILD.apk"
          # 직전 버전 이후 앱에 영향 있는 커밋만 변경 내역으로
          PREV=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("android-v"))][0].tagName // ""')
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then RANGE="$PREV..HEAD"; else RANGE="HEAD~20..HEAD"; fi
          CHANGES=$(git log --no-merges --pretty='- %s (%h)' $RANGE -- mobile lib | head -40)
          [ -z "$CHANGES" ] && CHANGES="- 앱 변경 없음 (빌드 설정만 변경)"
          cat > notes.md <<NOTES
          **근처맛집 $VERSION (빌드 $BUILD)** · 커밋 ${GITHUB_SHA::7}

          폰에서 아래 APK를 받아 기존 앱 위에 설치하세요. 에뮬레이터 실행 점검을 통과한 빌드입니다.

          ### 변경 내역${PREV:+ (since $PREV)}
          $CHANGES
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" "$APK" --title "근처맛집 $VERSION (빌드 $BUILD)" --notes-file notes.md --target "$GITHUB_SHA" --latest

      - name: 고정 링크(matjip-latest.apk) 갱신
        run: |
          cp "apk/matjip-$VERSION-$BUILD.apk" matjip-latest.apk
          NOTES="항상 최신 버전: 근처맛집 $VERSION (빌드 $BUILD). 버전별 기록은 android-v* Release를 보세요."
          if gh release view android-test >/dev/null 2>&1; then
            gh release edit android-test --title "근처맛집 최신 APK" --notes "$NOTES" --prerelease
          else
            gh release create android-test --title "근처맛집 최신 APK" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload android-test matjip-latest.apk --clobber
