name: Android APK (테스트용)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "앱이 호출할 추천 API 서버 주소"
        required: true
        default: "https://place.spikeryu.workers.dev"
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://place.spikeryu.workers.dev' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        # 테스트 배포용: 생성된 프로젝트의 기본 debug 키로 서명된 release APK
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/matjip-${GITHUB_SHA::7}.apk"
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: matjip-android-apk
          path: dist/*.apk
          retention-days: 14
